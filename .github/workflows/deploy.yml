name: Deploy to GitHub Pages

on:
  # Deploy every time you push to the `main` branch
  push:
    branches: [main]
  # Allows you to run this workflow manually from the Actions tab on GitHub
  workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; don't cancel one that is in progress
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v7
      - name: Install, build, and upload your site
        uses: withastro/action@v6
        with:
          node-version: 24
        # astro.config.mjs reads GITHUB_REPOSITORY automatically, so both
        # USERNAME.github.io and USERNAME.github.io/REPOSITORY work.
        # For a custom domain, uncomment and edit:
        # env:
        #   SITE_URL: 'https://www.example.com'
        #   BASE_PATH: '/'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
